# Copie para escriba.toml e ajuste. Todos os campos são opcionais;
# o que não estiver aqui usa o padrão de src/escriba/config.py.

output_dir = "transcricoes"
mic_label = "Eu"
system_label = "Participantes"

[audio]
# Deixe comentado para detecção automática. Aceita índice ou trecho do nome
# (veja `escriba dispositivos`).
# system_device = "alsa_output.pci-0000_00_1f.3.analog-stereo.monitor"
# mic_device = "Yeti"
capture_mic = true
capture_system = true
backend = "auto"       # auto | wasapi | portaudio

[vad]
# Aumente a margem se o ruído da sala estiver abrindo falas fantasma;
# diminua se falas baixas estiverem passando batido.
speech_margin_db = 9.0
hangover_ms = 700
min_utterance_ms = 400

[asr]
engine = "faster-whisper"
# large-v3 é o melhor em português; em CPU sem GPU, "small" roda em tempo real.
model = "large-v3"
device = "auto"        # auto | cuda | cpu
compute_type = "auto"  # auto | float16 | int8_float16 | int8
language = "pt"
partial_interval_s = 1.2

[diarizacao]
# Separa as vozes dos participantes remotos ("Falante 1", "Falante 2"...).
# Precisa de um modelo de embedding de falante em .onnx, baixado à parte:
#   curl -LO https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
enabled = false
# model = "modelos/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx"
# Cosseno mínimo para juntar duas falas na mesma pessoa. Abaixe se a mesma voz
# estiver virando dois falantes; suba se duas pessoas estiverem se misturando.
threshold = 0.55
max_speakers = 12
min_audio_s = 1.2
# O microfone é sempre você, então só a trilha remota é separada.
tracks = ["sistema", "arquivo"]

[vozes]
# Nome automático para quem já foi cadastrado com `escriba vozes cadastrar`.
enabled = true
store = "vozes.json"
# Limiar mais alto que o do agrupamento: errar o nome de alguém é pior do que
# deixar como "Falante 2".
threshold = 0.62

[summary]
enabled = true
model = "claude-opus-5"

[server]
host = "127.0.0.1"
port = 8777
